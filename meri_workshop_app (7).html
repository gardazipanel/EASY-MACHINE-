:root{--bg:#e9edf6;--c:#fff;--t:#1c2230;--m:#6b7385;--g:#16a34a;--o:#f59e0b;--r:#ef4444;--bd:#e3e7ef;--ic:#eef1f7}
body.dark{--bg:#0a0f1e;--c:#131a2d;--t:#f4f7ff;--m:#8b97b3;--g:#22c55e;--bd:#1f2a44;--ic:#1e2740}
*{box-sizing:border-box;margin:0;font-family:"Bebas Neue","Arial Narrow",Impact,sans-serif;letter-spacing:1.5px;font-weight:400}
html{font-size:var(--fs,16px)}body{background:var(--bg);color:var(--t);padding-bottom:90px}b,strong{font-weight:400}
.w{max-width:640px;margin:auto;padding:14px}.hd{display:flex;justify-content:space-between;align-items:center;margin-top:6px}.hd>div:last-child{display:flex;gap:10px}
.hd small{letter-spacing:4px;font-size:1rem}h1{font-size:2.2rem;line-height:1;text-transform:uppercase}h3{font-size:1.3rem;margin:10px 0 4px}
.m,small{color:var(--m)}small{font-size:.9rem;text-transform:uppercase}
.ib{background:var(--c);border:1px solid var(--bd);border-radius:14px;width:44px;height:44px;color:var(--t);cursor:pointer;display:flex;align-items:center;justify-content:center}
.sub{background:linear-gradient(90deg,#2563eb,#3b82f6);color:#fff;border-radius:30px;padding:10px 16px;margin:10px 0;font-size:1.15rem;cursor:pointer;display:flex;align-items:center;gap:10px}.sub.warn{background:linear-gradient(90deg,#b45309,#f59e0b)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.bx{background:var(--c);border:1px solid var(--bd);border-radius:20px;padding:12px;position:relative;overflow:hidden;cursor:pointer;display:block}
.bx::before{content:"";position:absolute;top:0;left:12px;right:12px;height:4px;border-radius:0 0 14px 14px;background:var(--g)}
.bx.o::before{background:var(--o)}.bx.rd::before{background:#f87171}.bx.bu::before{background:#3b82f6}
.bx i{width:38px;height:38px;border-radius:12px;background:var(--ic);display:flex;align-items:center;justify-content:center;margin-bottom:10px;color:var(--g)}
.bx.o i{color:var(--o)}.bx.rd i{color:#f87171}.bx.bu i{color:#3b82f6}
.bx small{display:block;font-size:1rem;color:var(--t)}.bx b{display:block;font-size:1.9rem;color:var(--g);line-height:1.1}.bx.o b{color:var(--o)}.bx.rd b{color:#f87171}.bx.bu b{color:#3b82f6}
.bx em{font-style:normal;font-size:.85rem;color:var(--m);text-transform:uppercase}
.bx.gr,.bx.bl{display:flex;align-items:center;gap:10px;color:#fff;border:0;padding:12px}.bx.gr::before,.bx.bl::before{display:none}
.bx.gr{background:linear-gradient(135deg,#22c55e,#15803d)}.bx.bl{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}
.bx.gr i,.bx.bl i{background:#ffffff33;margin:0;flex:none;color:#fff}.bx.gr small,.bx.bl small,.bx.gr b,.bx.bl b,.bx.gr em,.bx.bl em{color:#fff}
.bt{display:block;width:100%;border:0;border-radius:16px;padding:11px;font-size:1.25rem;color:#fff;background:linear-gradient(135deg,#22c55e,#15803d);cursor:pointer;margin:8px 0;text-transform:uppercase}
.bt.bl{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}.bt.r{background:var(--r)}.bt.o{background:var(--o)}.bt.sm{display:inline-block;width:auto;padding:4px 12px;font-size:1rem;margin:3px;border-radius:12px}
input,select,textarea{width:100%;padding:10px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--t);font-size:1.15rem;margin:4px 0 8px;font-family:inherit;letter-spacing:1.5px}
input::placeholder,textarea::placeholder{color:var(--m)}select option{background:var(--c);color:var(--t)}
label{font-size:.9rem;color:var(--m);text-transform:uppercase;letter-spacing:2px}
.cd{background:var(--c);border:1px solid var(--bd);border-radius:20px;padding:12px;margin:10px 0}.cd h3{margin:0 0 4px;font-size:1.4rem}.big{display:block;font-size:1.9rem;color:var(--g)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--bd);font-size:1.1rem}.kv span{color:var(--m)}
.row{background:var(--c);border:1px solid var(--bd);border-radius:18px;padding:11px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.row>div:first-child{flex:1;min-width:0;font-size:1.1rem}.tg{background:var(--g);color:#fff;border-radius:14px;padding:3px 10px;font-size:.9rem}
.ch{display:inline-block;padding:6px 14px;border-radius:18px;background:var(--c);border:1px solid var(--bd);margin:3px 2px;cursor:pointer;font-size:1.1rem}.ch.on{background:#3b82f6;border-color:#3b82f6;color:#fff}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--c);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 0 8px;z-index:5}
nav div{text-align:center;font-size:.85rem;color:var(--m);cursor:pointer;flex:1}nav div span{display:flex;justify-content:center;margin-bottom:3px}nav .on{color:var(--g)}
nav .ctr span{width:50px;height:50px;align-items:center;border-radius:50%;background:var(--c);border:1px solid var(--bd);box-shadow:0 0 0 6px var(--c);margin:-26px auto 3px}
.fab{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);width:min(92%,600px);z-index:4;box-shadow:0 8px 24px #22c55e55}
#md{display:none;position:fixed;inset:0;background:#000b;z-index:9;overflow:auto}#md.on{display:block}
.mb{background:var(--bg);max-width:620px;margin:20px auto;border-radius:20px;padding:14px;min-height:100px;border:1px solid var(--bd)}.mh{display:flex;justify-content:space-between;align-items:center;font-size:1.5rem;margin-bottom:8px}

function st(){const left=Math.max(0,Math.ceil((D.sub.exp-now())/DAY)),s=D.shop;
 modal('Settings',`<div class="sub ${D.sub.paid&&left<=7?'warn':''}">${ic('key')} ${left>0?(D.sub.paid?'SUBSCRIPTION ACTIVE':'FREE TRIAL'):'SUBSCRIPTION KHATAM'} - ${left} DIN BAQI<br><small style="color:#fff">Expiry: ${new Date(D.sub.exp).toLocaleDateString('en-GB')}</small></div><button class="bt bl" onclick="subm()">Subscription Page</button>
 <h3>SHOP KI MALOOMAT</h3><label>Shop ka naam</label><input id="h_n" value="${e(s.name)}"><label>Shop mobile</label><input id="h_m" value="${e(s.mobile)}"><label>Shop address</label><input id="h_a" value="${e(s.addr)}"><label>Currency</label><input id="h_c" value="${e(s.cur)}"><button class="bt" onclick="D.shop={name:$('#h_n').value||'Meri Workshop',mobile:$('#h_m').value,addr:$('#h_a').value,cur:$('#h_c').value||'RS.'};save();cl();render()">Save Karein</button>
 <h3>DISPLAY</h3><div class="row"><div>Dark Mode</div><button class="bt sm ${D.dark?'':'bl'}" onclick="D.dark=1;save();render();st()">${D.dark?'ON':'OFF'}</button></div><div class="row"><div>Light Mode</div><button class="bt sm ${D.dark?'bl':''}" onclick="D.dark=0;save();render();st()">${D.dark?'OFF':'ON'}</button></div><label>UI Size: ${D.ui}%</label><input type="range" min="80" max="130" value="${D.ui}" oninput="D.ui=+this.value;save();render();st()">
 <h3>DATA BACKUP</h3><button class="bt" onclick="const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='easy_machine_backup.json';a.click()">Backup File Download</button><button class="bt bl" onclick="cp(JSON.stringify(D))">Backup Copy</button>
 <label>Backup file chunein (mobile se)</label><input type="file" accept=".json" onchange="const r=new FileReader();r.onload=()=>rs(r.result);r.readAsText(this.files[0])"><label>Ya backup text yahan paste karein</label><textarea id="h_t" rows="3"></textarea><button class="bt o" onclick="rs($('#h_t').value)">Restore Karein</button>`)}
function rs(t){try{const o=JSON.parse(t);if(!o.shop||!o.sub)throw 0;if(!confirm('Purana data replace ho jayega. Restore karein?'))return;o.dev=D.dev;D=o;save();cl();render();toast('Restore ho gaya ✔')}catch(x){toast('Backup sahi nahi hai')}}
const PL=[[30,100,'1 Month'],[90,300,'3 Months'],[180,600,'6 Months'],[365,1200,'1 Year']];let sp=0;
function subm(){cl();tab='sub';render();scrollTo(0,0)}
function subp(){const left=Math.max(0,Math.ceil((D.sub.exp-now())/DAY)),pd=D.sub.paid,kv=(a,b,g)=>`<div class="kv"><span>${a}</span><b${g?' style="color:var(--g)"':''}>${b}</b></div>`;
 return`<div class="sub" style="padding:12px;cursor:default"><i class="ii" style="background:#ffffff33;color:#fff;font-style:normal">${ic('check')}</i><div><small style="color:#fff">EXPIRY ${new Date(D.sub.exp).toISOString().slice(0,10)}</small><div style="font-size:1.7rem;line-height:1">${left>0?(pd?'SUBSCRIPTION ACTIVE':'FREE TRIAL'):'SUBSCRIPTION KHATAM'} - ${left} DIN BAQI</div></div></div>
 <p class="m" style="font-size:1.1rem;margin:6px 0">AAP KA SARA DATA SAFE HAI. RENEW KARNA HO TO PLAN CHUNEIN, WHATSAPP PAR PAISE BHEJEIN, PHIR MILNE WALA CODE YAHAN DAALEIN.</p>
 <div class="cd"><div class="grid" style="margin-top:0">${PL.map((p,i)=>`<div class="pl ${sp==i?'on':''}" style="--a:${['#22c55e','#f59e0b','#22c55e','#f97316'][i]}" onclick="sp=${i};render()"><small>${p[2]}</small><b>RS ${p[1]}</b></div>`).join('')}</div>
 <div class="row" style="background:var(--bg)"><div style="display:flex;gap:10px;align-items:center"><i class="ii">${ic('cash')}</i><div><small>EASYPAISA PAR PAISE BHEJEIN</small><div style="font-size:1.7rem">0318 4587211</div></div></div><span onclick="cp('03184587211')" style="color:#3b82f6;cursor:pointer">${ic('copy')}</span></div>
 <p class="m" style="font-size:1rem;margin:6px 0">PAYMENT KE BAAD SCREENSHOT WHATSAPP PAR BHEJEIN, PHIR ACTIVATION CODE MILEGA.</p>
 <button class="bt" onclick="renew()" style="display:flex;align-items:center;justify-content:center;gap:8px">${ic('chat')} WhatsApp se Renew Karein</button>
 <label>Activation code (WhatsApp par milega)</label><input id="ac" placeholder="030-XXXXX-XXXXXXXXXXXX"><button class="bt bl" onclick="act()" style="display:flex;align-items:center;justify-content:center;gap:8px">${ic('key')} Activate Karein</button>
 <div style="display:flex;justify-content:space-between;align-items:center;font-size:1.2rem"><span><span class="m">DEVICE ID:</span> ${D.dev}</span><span onclick="cp(D.dev)" style="color:#3b82f6;cursor:pointer">${ic('copy')}</span></div></div>
 <div class="cd"><h3>Subscription ki Maloomat</h3>${kv('Current Plan',pd?(D.sub.plan||'PAID'):'FREE TRIAL')}${kv('Activation Status',left>0?(pd?'ACTIVE':'FREE TRIAL CHAL RAHA HAI'):'KHATAM',left>0)}${kv('Remaining Days',left)}${kv('Expiry Date',new Date(D.sub.exp).toLocaleDateString('en-GB'))}${kv('Device ID',D.dev)}${kv('Activation Code',D.sub.code||'-')}</div>`}
function renew(){const p=PL[sp];wa('03184587211',`Assalam o Alaikum, mujhe Easy Machine app renew karni hai.\nPlan: ${p[2]} (RS ${p[1]})\nShop: ${D.shop.name}\nDevice ID: ${D.dev}\nPayment ka screenshot bhej raha hun.`)}
function act(){const c=$('#ac').value.trim().toUpperCase(),d=parseInt(c.slice(0,3)),n=c.split('-')[1]||'';if(!d||!n||c!=mk(D.dev,d,n))return toast('Code galat hai');if(D.sub.used.includes(c))return toast('Yeh code pehle use ho chuka');D.sub.used.push(c);D.sub.code=c;D.sub.plan=(PL.find(x=>x[0]==d)||[0,0,d+' Din'])[2];D.sub.paid=1;D.sub.exp=Math.max(now(),D.sub.exp)+d*DAY;save();cl();render();toast('Subscription active ✔ +'+d+' din')}
render();
</script></body></html>
